<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Renderways — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #05070e;
        color: #eef3fb;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0ea5e9, #4f46e5 55%, #7c3aed);
        box-shadow: 0 12px 32px rgba(79, 70, 229, 0.4);
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 auto 28px; max-width: 300px; color: #98a6bf; line-height: 1.5; font-size: 15px; }
      button {
        border: 0;
        border-radius: 14px;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        color: #04121a;
        background: #22d3ee;
      }
      a { display: block; margin-top: 20px; color: #22d3ee; font-size: 14px; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
          <path d="M4 18V7.5a2 2 0 0 1 2-2h5.5a3.75 3.75 0 0 1 1.6 7.14L17 18" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="18.5" cy="6.5" r="2" fill="#fff" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Renderways needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
      <button type="button" onclick="location.replace('https://rtpl.systimus.in')">Try again</button>
      <a href="tel:+917358189215">Call us: +91 73581 89215</a>
    </main>
  </body>
</html>
